[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "combinatorial-test-table-generator"
version = "0.1.0"
description = "离线、确定性的两两覆盖组合测试表生成器"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "dc" }]
keywords = ["software-testing", "pairwise", "covering-array"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Natural Language :: Chinese (Simplified)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.scripts]
combinatorial-test-table-generator = "combinatorial_test_table_generator.command_line_interface:main"

[tool.setuptools]
packages = ["combinatorial_test_table_generator"]
